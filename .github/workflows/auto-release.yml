name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v1.1.2；留空自动递增）'
        required: false
        type: string

concurrency:
  group: ecs-controller-main-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Go packages
        run: go test ./...
      - name: Check Go code
        run: go vet ./...
      - name: Test browser helpers
        run: node --test tests/*.test.cjs

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Remove legacy release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.17.1 >/dev/null 2>&1; then
            gh release delete v1.17.1 --yes
          fi

      - name: Generate next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "版本号必须采用 v1.1.2 格式" >&2
              exit 1
            fi
            next_tag="$REQUESTED_VERSION"
          elif [[ "$previous_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "无法识别当前稳定发行版：$previous_tag" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$previous_tag" "$next_tag" | sort -V | head -n 1)" != "$previous_tag" || "$next_tag" == "$previous_tag" ]]; then
            echo "新版本必须高于当前稳定发行版：$previous_tag" >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$next_tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$next_tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "版本标签已指向其他提交：$next_tag ($tag_commit)" >&2
              exit 1
            fi
          fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "name=${next_tag#v}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          ECS_VERSION: ${{ steps.version.outputs.tag }}
          ECS_COMMIT: ${{ github.sha }}
          ECS_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          OUTPUT_DIR: ${{ runner.temp }}/ecs-controller-binaries
        run: ./build.sh

      - name: Package release assets
        shell: bash
        env:
          BIN_DIR: ${{ runner.temp }}/ecs-controller-binaries
          ECS_RELEASE_SIGNING_KEY: ${{ secrets.ECS_RELEASE_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$ECS_RELEASE_SIGNING_KEY" ]]; then
            echo "缺少 ECS_RELEASE_SIGNING_KEY，拒绝发布未签名版本。请在 Settings -> Secrets and variables -> Actions 中配置与 internal/app/release-public-key.pem 匹配的完整 Ed25519 PEM 私钥。" >&2
            exit 1
          fi
          release_dir="$RUNNER_TEMP/ecs-controller-release"
          mkdir -p "$release_dir"

          package_linux() {
            arch="$1"
            stage="$(mktemp -d)"
            cp "$BIN_DIR/ecs-controller-linux-$arch" "$stage/ecs-controller"
            cp "$BIN_DIR/template.html" "$stage/template.html"
            cp -R "$BIN_DIR/static" "$stage/static"
            cp updater.sh "$stage/updater.sh"
            chmod 0755 "$stage/ecs-controller" "$stage/updater.sh"
            tar -C "$stage" -czf "$release_dir/ecs-controller-linux-$arch.tar.gz" \
              ecs-controller updater.sh template.html static
          }

          package_windows() {
            arch="$1"
            stage="$(mktemp -d)"
            cp "$BIN_DIR/ecs-controller-windows-$arch.exe" "$stage/ecs-controller.exe"
            cp "$BIN_DIR/template.html" "$stage/template.html"
            cp -R "$BIN_DIR/static" "$stage/static"
            (cd "$stage" && zip -qr "$release_dir/ecs-controller-windows-$arch.zip" \
              ecs-controller.exe template.html static)
          }

          package_linux amd64
          package_linux arm64
          package_windows amd64
          package_windows arm64
          (cd "$release_dir" && sha256sum ecs-controller-* > checksums.txt)
          signing_key="$RUNNER_TEMP/ecs-controller-release-signing.pem"
          derived_public_key="$RUNNER_TEMP/ecs-controller-release-public.pem"
          printf '%s\n' "$ECS_RELEASE_SIGNING_KEY" >"$signing_key"
          chmod 0600 "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$derived_public_key"
          diff -u internal/app/release-public-key.pem "$derived_public_key"
          openssl pkeyutl -sign -rawin -inkey "$signing_key" -in "$release_dir/checksums.txt" -out "$release_dir/checksums.txt.sig"
          rm -f "$signing_key"
          ls -lh "$release_dir"

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body: 更新与优化。
          artifacts: ${{ runner.temp }}/ecs-controller-release/*
          artifactErrorsFailBuild: true
          allowUpdates: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
